<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Temperature & Humidity Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#0b1220;
  --card:#1e293b;
  --card2:#111827;
  --accent:#38bdf8;
  --warn:#facc15;
  --text:#ffffff;
  --muted:rgba(255,255,255,.65);
}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text);}
header{padding:18px 26px;background:linear-gradient(135deg,#0284c7,#0ea5e9);}
header h1{margin:0;font-size:20px;font-weight:800;}
.container{max-width:1200px;margin:auto;padding:20px}

/* NAV */
.nav{display:flex;justify-content:space-between;align-items:center;margin:18px 0}
.tabs span{margin-right:22px;font-weight:700;cursor:pointer;opacity:.6}
.tabs .active{opacity:1;border-bottom:3px solid var(--accent);padding-bottom:6px}

/* DAY STRIP */
.days{display:flex;gap:14px;margin-bottom:18px;overflow-x:auto}
.day{
  background:var(--card);
  padding:14px;
  border-radius:16px;
  min-width:130px;
  cursor:pointer;
}
.day.active{background:#334155}
.day .date{font-size:12px;opacity:.8}
.day .big{font-size:22px;font-weight:800;margin-top:4px}
.pill{margin-top:6px;font-size:12px;opacity:.85}

/* SECTIONS */
.section{display:none}
.section.active{display:block}

/* HERO */
.hero{
  background:linear-gradient(180deg,#0284c7,#0369a1);
  border-radius:26px;
  padding:26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.hero h2{margin:0;font-size:34px}
.hero .meta{margin-top:12px;line-height:1.8}
.hero img{width:140px}

/* HOURLY STRIP */
.hour-strip{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:12px;
  background:var(--card2);
  border-radius:18px;
  margin-bottom:16px;
}
.hour{
  min-width:110px;
  background:rgba(255,255,255,.06);
  border-radius:16px;
  padding:10px;
  text-align:center;
}
.hour img{width:32px}
.hour .t{font-size:12px;opacity:.8}
.hour .temp{font-size:18px;font-weight:800}
.hour .conf{font-size:11px;opacity:.7}

/* CARDS */
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:16px}
.chart-wrap{height:260px}
canvas{width:100%!important;height:100%!important}
</style>
</head>

<body>
<header>
  <h1>Smart Temperature & Humidity Dashboard</h1>
</header>

<div class="container">

<div class="nav">
  <div class="tabs">
    <span class="active" onclick="switchTab('hourly')">Hourly</span>
    <span onclick="switchTab('day')">Day</span>
    <span onclick="switchTab('monthly')">Monthly</span>
  </div>
</div>

<div class="days" id="days"></div>

<!-- HOURLY -->
<div id="hourly" class="section active">
  <div class="hour-strip" id="hourStrip"></div>

  <div class="card">
    <h3>🌡️ Temperature (°C)</h3>
    <div class="chart-wrap"><canvas id="tempChart"></canvas></div>
  </div>

  <div class="card">
    <h3>💧 Humidity (%)</h3>
    <div class="chart-wrap"><canvas id="humChart"></canvas></div>
  </div>
</div>

<!-- DAY -->
<div id="day" class="section">
  <div class="hero">
    <div>
      <h2 id="heroDay"></h2>
      <div class="meta">
        🌡️ <span id="heroTemp"></span><br>
        💧 <span id="heroHum"></span><br>
        🧭 <span id="heroCond"></span>
      </div>
    </div>
    <img id="heroIcon">
  </div>
</div>

<!-- MONTHLY -->
<div id="monthly" class="section">
  <div class="card" id="monthlyList"></div>
</div>

</div>

<script>
/* ================= LOAD CSV ================= */
let rawRows=[], hourlyData={}, dates=[], currentDate="";

async function loadCSV(){
  const res = await fetch("data/tapo_data.csv",{cache:"no-store"});
  const text = await res.text();
  const lines = text.trim().split("\n").slice(1);

  rawRows = lines.map(l=>{
    const [ts,t,h]=l.split(",");
    const d=new Date(ts.replace(" ","T"));
    return {
      date:d.toISOString().slice(0,10),
      hour:d.getHours(),
      temp:+t,
      hum:+h
    };
  });

  aggregate();
  buildDays();
  currentDate = dates[dates.length-1];
  updateAll();
}

/* ================= AGGREGATE PER MINUTE → HOURLY ================= */
function aggregate(){
  hourlyData={};
  rawRows.forEach(r=>{
    hourlyData[r.date] ??= {};
    hourlyData[r.date][r.hour] ??= {t:[],h:[]};
    hourlyData[r.date][r.hour].t.push(r.temp);
    hourlyData[r.date][r.hour].h.push(r.hum);
  });
  dates = Object.keys(hourlyData).sort();
}

/* ================= ESTIMATED CONDITIONS ================= */
function estimate(t,h,hr){
  const night=(hr>=18||hr<6);
  if(night && h>=85) return ["Humid night","https://img.icons8.com/color/96/fog-night.png","Medium"];
  if(h>=80) return ["Very humid","https://img.icons8.com/color/96/cloud.png","Medium"];
  if(h>=65) return ["Possible cloudiness","https://img.icons8.com/color/96/partly-cloudy-day.png","Low"];
  if(!night && t>=28 && h<65) return ["Clear & warm","https://img.icons8.com/color/96/sun.png","Medium"];
  return ["Normal","https://img.icons8.com/color/96/moon.png","Low"];
}

/* ================= CHARTS ================= */
const tempChart=new Chart(document.getElementById("tempChart"),{
  type:"line",
  data:{labels:[],datasets:[{data:[],borderColor:"#38bdf8",backgroundColor:"rgba(56,189,248,.3)",fill:true,tension:.4}]},
  options:{plugins:{legend:{display:false}}}
});
const humChart=new Chart(document.getElementById("humChart"),{
  type:"bar",
  data:{labels:[],datasets:[{data:[],backgroundColor:"rgba(250,204,21,.6)",borderRadius:10}]},
  options:{plugins:{legend:{display:false}},scales:{y:{min:0,max:100}}}
});

/* ================= UI ================= */
function buildDays(){
  const days=document.getElementById("days");
  days.innerHTML="";
  dates.forEach(d=>{
    const hrs=Object.values(hourlyData[d]);
    const avgT=avg(hrs.flatMap(x=>x.t));
    const avgH=avg(hrs.flatMap(x=>x.h));
    const el=document.createElement("div");
    el.className="day"+(d===currentDate?" active":"");
    el.innerHTML=`
      <div class="date">${d}</div>
      <div class="big">${avgT.toFixed(0)}°</div>
      <div class="pill">💧 ${avgH.toFixed(0)}%</div>`;
    el.onclick=()=>{currentDate=d;updateAll();}
    days.appendChild(el);
  });
}

function updateAll(){
  buildDays();
  const day=hourlyData[currentDate];
  const hours=Object.keys(day).sort((a,b)=>a-b);

  const tArr=[],hArr=[];
  const strip=document.getElementById("hourStrip");
  strip.innerHTML="";

  hours.forEach(h=>{
    const t=avg(day[h].t), hum=avg(day[h].h);
    const [txt,icon,conf]=estimate(t,hum,+h);
    strip.innerHTML+=`
      <div class="hour">
        <div class="t">${h}:00</div>
        <img src="${icon}">
        <div class="temp">${t.toFixed(1)}°</div>
        <div class="conf">${txt}<br>${conf}</div>
      </div>`;
    tArr.push(t); hArr.push(hum);
  });

  tempChart.data.labels=hours.map(h=>h+":00");
  tempChart.data.datasets[0].data=tArr;
  tempChart.update();

  humChart.data.labels=hours.map(h=>h+":00");
  humChart.data.datasets[0].data=hArr;
  humChart.update();

  const mid=Math.floor(hours.length/2);
  const [txt,icon,conf]=estimate(tArr[mid],hArr[mid],+hours[mid]);
  heroDay.innerText=currentDate;
  heroTemp.innerText=avg(tArr).toFixed(1)+" °C";
  heroHum.innerText=avg(hArr).toFixed(1)+" %";
  heroCond.innerText=txt+" ("+conf+")";
  heroIcon.src=icon;

  document.getElementById("monthlyList").innerHTML=
    dates.map(d=>{
      const h=Object.values(hourlyData[d]);
      return `<div>${d} — 🌡️ ${avg(h.flatMap(x=>x.t)).toFixed(1)}° • 💧 ${avg(h.flatMap(x=>x.h)).toFixed(0)}%</div>`;
    }).join("<hr>");
}

/* ================= UTILS ================= */
function avg(a){return a.reduce((x,y)=>x+y,0)/a.length}
function switchTab(t){
  document.querySelectorAll(".tabs span").forEach(x=>x.classList.remove("active"));
  document.querySelector(`.tabs span[onclick*=${t}]`).classList.add("active");
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(t).classList.add("active");
}

/* INIT */
loadCSV();
</script>
</body>
</html>
