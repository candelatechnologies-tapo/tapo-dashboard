<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Temperature & Humidity Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#0b1220;
  --card:#1e293b;
  --card2:#111827;
  --accent:#38bdf8;
  --warn:#facc15;
  --text:#fff;
  --muted:rgba(255,255,255,.65);
}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text);}
header{padding:18px 26px;background:linear-gradient(135deg,#0284c7,#0ea5e9);}
header h1{margin:0;font-size:20px;font-weight:800}
.container{max-width:1200px;margin:auto;padding:20px}

/* NAV */
.nav{display:flex;justify-content:space-between;align-items:center;margin:18px 0}
.tabs span{margin-right:22px;font-weight:700;cursor:pointer;opacity:.6}
.tabs .active{opacity:1;border-bottom:3px solid var(--accent);padding-bottom:6px}

/* DAY STRIP */
.days{display:flex;gap:14px;margin-bottom:18px;overflow-x:auto}
.day{background:var(--card);padding:14px;border-radius:16px;min-width:120px;cursor:pointer}
.day.active{background:#334155}
.day .date{font-size:12px;opacity:.8}
.day .big{font-size:22px;font-weight:800}
.pill{margin-top:6px;font-size:12px;opacity:.8}

/* SECTIONS */
.section{display:none}
.section.active{display:block}

/* HERO */
.hero{
  background:linear-gradient(180deg,#0284c7,#0369a1);
  border-radius:26px;
  padding:26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.hero h2{margin:0;font-size:34px}
.hero .meta{margin-top:12px;line-height:1.8}
.hero img{width:140px}

/* HOURLY STRIP */
.hour-strip{
  display:flex;gap:12px;overflow-x:auto;
  padding:12px;background:var(--card2);
  border-radius:18px;margin-bottom:16px;
}
.hour{min-width:105px;background:rgba(255,255,255,.06);border-radius:16px;padding:10px;text-align:center}
.hour img{width:30px}
.hour .t{font-size:12px;opacity:.8}
.hour .temp{font-size:18px;font-weight:800}
.hour .hum{font-size:12px;opacity:.7}

/* CARDS */
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:16px}
.chart-wrap{height:260px}
canvas{width:100%!important;height:100%!important}
</style>
</head>

<body>
<header>
  <h1>Smart Temperature & Humidity Dashboard</h1>
</header>

<div class="container">

<div class="nav">
  <div class="tabs">
    <span class="active" onclick="switchTab('hourly')">Hourly</span>
    <span onclick="switchTab('day')">Day</span>
    <span onclick="switchTab('monthly')">Monthly</span>
  </div>
</div>

<div class="days" id="days"></div>

<!-- HOURLY -->
<div id="hourly" class="section active">
  <div class="hour-strip" id="hourStrip"></div>

  <div class="card">
    <h3>🌡️ Hourly Temperature (°C)</h3>
    <div class="chart-wrap"><canvas id="tempChart"></canvas></div>
  </div>

  <div class="card">
    <h3>💧 Hourly Humidity (%)</h3>
    <div class="chart-wrap"><canvas id="humChart"></canvas></div>
  </div>
</div>

<!-- DAY -->
<div id="day" class="section">
  <div class="hero">
    <div>
      <h2 id="heroDay"></h2>
      <div class="meta">
        🌡️ <span id="heroTemp"></span><br>
        💧 <span id="heroHum"></span><br>
        🧭 <span id="heroCond"></span>
      </div>
    </div>
    <img id="heroIcon">
  </div>
</div>

<!-- MONTHLY -->
<div id="monthly" class="section">
  <div class="card" id="monthlyList"></div>
</div>

</div>

<script>
/* ===================== GLOBAL ===================== */
let weatherData={}, currentDate=null;

/* ===================== SMART ICON ===================== */
function smartIcon(t,h,hr){
  const night=(hr>=18||hr<6);
  if(night && h>=85) return "https://img.icons8.com/color/96/fog-night.png";
  if(h>=80) return "https://img.icons8.com/color/96/cloud.png";
  if(!night && t>=28 && h<65) return "https://img.icons8.com/color/96/sun.png";
  return night
    ? "https://img.icons8.com/color/96/moon.png"
    : "https://img.icons8.com/color/96/partly-cloudy-day.png";
}

/* ===================== LOAD CSV ===================== */
async function loadCSV(){
  const res = await fetch("data/tapo_data.csv",{cache:"no-store"});
  const text = await res.text();
  const lines = text.trim().split("\n").slice(1);

  lines.forEach(l=>{
    const [ts,t,h]=l.split(",");
    const d=new Date(ts.replace(" ","T"));
    const date=d.toISOString().slice(0,10);
    const hour=d.getHours();

    weatherData[date] ??= {hours:{},temp:{},hum:{}};
    weatherData[date].temp[hour] ??= [];
    weatherData[date].hum[hour] ??= [];
    weatherData[date].temp[hour].push(+t);
    weatherData[date].hum[hour].push(+h);
  });

  Object.keys(weatherData).forEach(d=>{
    const o=weatherData[d];
    o.hours=Object.keys(o.temp).sort((a,b)=>a-b);
    o.temp=o.hours.map(h=>avg(o.temp[h]));
    o.hum=o.hours.map(h=>avg(o.hum[h]));
  });

  currentDate=Object.keys(weatherData).sort().pop();
  buildDays();
  updateAll();
}

/* ===================== UI ===================== */
function buildDays(){
  const days=document.getElementById("days");
  days.innerHTML="";
  Object.keys(weatherData).sort().forEach(d=>{
    const o=weatherData[d];
    const el=document.createElement("div");
    el.className="day"+(d===currentDate?" active":"");
    el.innerHTML=`
      <div class="date">${d}</div>
      <div class="big">${Math.max(...o.temp).toFixed(0)}°</div>
      <div class="pill">💧 ${avg(o.hum).toFixed(0)}%</div>`;
    el.onclick=()=>{currentDate=d;updateAll();}
    days.appendChild(el);
  });
}

function updateAll(){
  document.querySelectorAll(".day").forEach(d=>d.classList.toggle("active",d.innerText.includes(currentDate)));
  const d=weatherData[currentDate];

  /* Hourly cards */
  const strip=document.getElementById("hourStrip");
  strip.innerHTML="";
  d.hours.forEach((h,i)=>{
    strip.innerHTML+=`
      <div class="hour">
        <div class="t">${h}:00</div>
        <img src="${smartIcon(d.temp[i],d.hum[i],+h)}">
        <div class="temp">${d.temp[i].toFixed(1)}°</div>
        <div class="hum">${d.hum[i].toFixed(0)}%</div>
      </div>`;
  });

  /* Charts */
  tempChart.data.labels=d.hours.map(h=>h+":00");
  tempChart.data.datasets[0].data=d.temp;
  tempChart.update();

  humChart.data.labels=d.hours.map(h=>h+":00");
  humChart.data.datasets[0].data=d.hum;
  humChart.update();

  /* Day hero */
  heroDay.innerText=currentDate;
  heroTemp.innerText=avg(d.temp).toFixed(1)+" °C";
  heroHum.innerText=avg(d.hum).toFixed(1)+" %";
  heroCond.innerText="Estimated conditions";
  heroIcon.src=smartIcon(avg(d.temp),avg(d.hum),12);

  /* Monthly */
  monthlyList.innerHTML=Object.keys(weatherData).map(x=>{
    const o=weatherData[x];
    return `<div>${x} — 🌡️ ${avg(o.temp).toFixed(1)}° • 💧 ${avg(o.hum).toFixed(0)}%</div>`;
  }).join("<hr>");
}

/* ===================== CHARTS ===================== */
const tempChart=new Chart(tempChartCanvas={
  getContext:()=>document.getElementById("tempChart").getContext("2d")
}.getContext(),{
  type:"line",
  data:{labels:[],datasets:[{data:[],borderColor:"#38bdf8",fill:true,backgroundColor:"rgba(56,189,248,.3)",tension:.4}]},
  options:{plugins:{legend:{display:false}}}
});

const humChart=new Chart(document.getElementById("humChart"),{
  type:"bar",
  data:{labels:[],datasets:[{data:[],backgroundColor:"rgba(250,204,21,.6)",borderRadius:10}]},
  options:{plugins:{legend:{display:false}},scales:{y:{min:0,max:100}}}
});

/* ===================== UTILS ===================== */
function avg(a){return a.reduce((x,y)=>x+y,0)/a.length}
function switchTab(t){
  document.querySelectorAll(".tabs span").forEach(x=>x.classList.remove("active"));
  document.querySelector(`.tabs span[onclick*=${t}]`).classList.add("active");
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(t).classList.add("active");
}

/* INIT */
loadCSV();
</script>
</body>
</html>
