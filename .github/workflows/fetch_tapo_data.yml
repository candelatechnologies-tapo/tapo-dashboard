name: Fetch Tapo Sensor Data

on:
  # Run automatically every 1 hour
  schedule:
    - cron: "0 * * * *"

  # Allow manual run from Actions tab
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Step 3: Install required Python libraries
      - name: Install dependencies
        run: |
          pip install tapo pandas pytz

      # Step 4: Run your existing fetch_tapo_data.py
      - name: Fetch Tapo sensor data
        env:
          TAPO_EMAIL: ${{ secrets.TAPO_EMAIL }}
          TAPO_PASSWORD: ${{ secrets.TAPO_PASSWORD }}
          TAPO_DEVICE_IP: ${{ secrets.TAPO_DEVICE_IP }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
        run: |
          python fetch_tapo_data.py

      # Step 5: Commit updated CSV back to repo
      - name: Commit updated CSV
        run: |
          git config user.name "tapo-bot"
          git config user.email "tapo-bot@users.noreply.github.com"
          git add data/tapo_data.csv
          git diff --cached --quiet || git commit -m "Auto-update sensor data"
          git push
